status: "draft v0.1, pending engineering review"
baseline_m: 30
metrics:
  pct_area_slope_gt24:
    label: "Share of area above 24 degrees"
    unit: "%"
    bands:
      # Basis: engineering-framework draft v0.1 threshold supplied in the task.
      - label: "low constraint"
        upper: 2
        upper_inclusive: false
        color: "#dcefe4"
      # Basis: engineering-framework draft v0.1 threshold supplied in the task.
      - label: "moderate"
        lower: 2
        lower_inclusive: true
        upper: 10
        upper_inclusive: true
        color: "#fff0c2"
      # Basis: engineering-framework draft v0.1 threshold supplied in the task.
      - label: "high"
